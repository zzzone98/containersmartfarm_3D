<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Lab 컨테이너 스마트팜 배치 3D 모델</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#E8702D;
  --bg:#F2F2F0;
  --panel:#FFFFFF;
  --ink:#24272A;
  --muted:#6A6F74;
  --line:#D6D7D4;
  --sky-a:#E9EEF1;
  --sky-b:#CBD3D8;
  --chip:#ECECEA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D1F; --panel:#24272A; --ink:#EDEDEB; --muted:#A1A6AB; --line:#3A3E42;
    --sky-a:#3A4046; --sky-b:#23272B; --chip:#2F3336;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D1F; --panel:#24272A; --ink:#EDEDEB; --muted:#A1A6AB; --line:#3A3E42;
  --sky-a:#3A4046; --sky-b:#23272B; --chip:#2F3336;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;
}
.app{display:grid;grid-template-columns:372px 1fr;height:100%}
.side{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.brand{
  background:var(--orange);color:#fff;padding:20px 22px 18px;position:relative;overflow:hidden;
}
.brand::after{ /* 컨테이너 래핑의 사선을 그대로 가져온 면 */
  content:"";position:absolute;right:-40px;top:0;bottom:0;width:150px;background:#B4B4B4;
  clip-path:polygon(60% 0,100% 0,100% 100%,0 100%);
}
.brand b{
  font-family:Montserrat,"Noto Sans KR",sans-serif;font-weight:800;font-size:21px;letter-spacing:.02em;display:block;position:relative;z-index:1
}
.brand span{font-size:13px;opacity:.95;position:relative;z-index:1}
.cases{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.cases button{
  appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;padding:12px 4px 10px;cursor:pointer;text-align:center;line-height:1.25;
  border-bottom:3px solid transparent;
}
.cases button:last-child{border-right:0}
.cases button strong{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:20px;color:inherit}
.cases button small{font-size:12px}
.cases button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.cases button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.info{padding:18px 22px 8px;overflow:auto;flex:1;min-height:0}
.info h1{font-size:19px;line-height:1.35;margin:0 0 6px;font-weight:700}
.info p{margin:0 0 12px;color:var(--muted);font-size:14px}
.info ul{margin:0 0 14px;padding-left:18px;font-size:14px}
.info li{margin-bottom:5px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0 0 6px;padding:12px 0 0;border-top:1px solid var(--line)}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.ctrl{padding:12px 22px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{
  appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;
  padding:5px 12px;border-radius:3px;cursor:pointer
}
.row button:hover{border-color:var(--orange)}
.row label{font-size:13px;display:flex;align-items:center;gap:6px;margin-right:10px;cursor:pointer}
.row input{accent-color:var(--orange);width:15px;height:15px;margin:0}
.view{position:relative;min-width:0;min-height:0;background:linear-gradient(var(--sky-a),var(--sky-b))}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);padding:3px 9px;border-radius:3px;opacity:.9}
.err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:46% 54%}
  .view{order:-1}
  .side{border-right:0;border-top:1px solid var(--line)}
  .brand{padding:10px 16px}
  .brand b{font-size:16px}
  .brand span{display:none}
  .info{padding:12px 16px 4px}
  .ctrl{padding:8px 16px 12px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>MONSTER LAB</b><span>컨테이너 스마트팜 8동 배치 검토 모델</span></div>
    <div class="cases" role="tablist" aria-label="배치안">
      <button role="tab" data-case="0" aria-selected="true"><strong>1</strong><small>일렬 2층</small></button>
      <button role="tab" data-case="1" aria-selected="false"><strong>2</strong><small>중앙통로 2층</small></button>
      <button role="tab" data-case="2" aria-selected="false"><strong>3</strong><small>단층 + 작업장</small></button>
      <button role="tab" data-case="3" aria-selected="false"><strong>4</strong><small>ㅁ자 중정</small></button>
    </div>
    <div class="info" id="info"></div>
    <div class="ctrl">
      <div class="row" aria-label="보기 방향">
        <button data-view="iso">조감</button>
        <button data-view="front">정면</button>
        <button data-view="back">배면</button>
        <button data-view="top">평면</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="tRoof" checked>지붕</label>
        <label><input type="checkbox" id="tF2" checked>2층</label>
        <label><input type="checkbox" id="tSite" checked>부지 50×20 m</label>
        <label><input type="checkbox" id="tPeople" checked>사람</label>
      </div>
    </div>
  </aside>
  <main class="view">
    <div id="stage"></div>
    <div class="hint">드래그 회전 / 휠 확대 / 우클릭 드래그 이동</div>
    <div class="err" id="err">3D를 그리지 못했습니다. WebGL을 지원하는 브라우저에서 다시 열어 주세요.</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
/* ---------- 기준 치수 (m) ---------- */
const L=12.192, W=2.438, H=2.591;      // 40ft 표준 컨테이너
const F2=3.3;                          // 2층 바닥 윗면 높이
const DECK_T=0.35;
const ST={n:20,tread:0.30,land:1.6,landAt:10,width:2.6};
const RUN=(ST.n-2)*ST.tread+ST.land;   // 계단 수평 길이 7.0 m
const ORANGE=0xE8702D, GRAY=0xB4B4B4;

let renderer,scene,camera,controls;
const stage=document.getElementById('stage');
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
}catch(e){ document.getElementById('err').style.display='grid'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(38,1,0.5,400);
controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI/2-0.02; controls.minDistance=6; controls.maxDistance=140;

scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f94,0.78));
const sun=new THREE.DirectionalLight(0xffffff,0.82);
sun.position.set(-26,42,30); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-36,right:36,top:30,bottom:-30,near:1,far:120});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
scene.add(sun);

/* ---------- 재질 ---------- */
const std=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.75,metalness:0.1},o||{}));
const M={
  steel:std(0x33373B,{roughness:0.55,metalness:0.5}),
  frame:std(0x9B9D9F,{roughness:0.6,metalness:0.4}),
  slab:std(0xD9D9D5,{roughness:0.95,metalness:0}),
  deck:std(0xC9CAC6,{roughness:0.9,metalness:0}),
  tread:std(0x55595D,{roughness:0.7,metalness:0.4}),
  roof:std(0x3C4044,{roughness:0.6,metalness:0.4,side:THREE.DoubleSide}),
  orange:std(ORANGE,{roughness:0.6}),
  panel:std(0xA9ABAD,{roughness:0.8}),
  wood:std(0xB98F5E,{roughness:0.85,metalness:0}),
  green:std(0x4F8A4B,{roughness:0.9,metalness:0}),
  glass:new THREE.MeshStandardMaterial({color:0xA9D6E5,transparent:true,opacity:0.26,roughness:0.08,metalness:0.1,side:THREE.DoubleSide,depthWrite:false}),
  site:std(0x8E9391,{roughness:1,metalness:0}),
  person:std(0x2B3A4A,{roughness:0.9,metalness:0})
};

/* ---------- 컨테이너 래핑 텍스처 (첨부 시안 기준) ---------- */
const OR='#E8702D', GR='#B4B4B4';
function corrugate(ctx,w,h,period,a){
  for(let x=0;x<w;x+=period){
    const g=ctx.createLinearGradient(x,0,x+period,0);
    g.addColorStop(0,'rgba(0,0,0,'+a+')'); g.addColorStop(0.3,'rgba(0,0,0,0)');
    g.addColorStop(0.55,'rgba(255,255,255,'+(a*0.8)+')'); g.addColorStop(0.8,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,'+a+')');
    ctx.fillStyle=g; ctx.fillRect(x,0,period,h);
  }
}
function poly(ctx,pts,fill){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function logo(ctx,x,y,s,fg,bg){
  poly(ctx,[[x,y],[x+s*0.5,y+s*0.36],[x+s,y],[x+s,y+s],[x,y+s]],fg);
  ctx.fillStyle=bg;
  ctx.fillRect(x+s*0.41,y+s*0.52,s*0.18,s*0.15);
  ctx.fillRect(x+s*0.41,y+s*0.80,s*0.18,s*0.20);
}
const FONT='Montserrat, "Noto Sans KR", Arial, sans-serif';
function wordmark(ctx,xRight,yBase,size){
  // "MONSTER LΛB" — A는 가로획 없는 형태
  ctx.font='800 '+size+'px '+FONT; ctx.textBaseline='alphabetic'; ctx.fillStyle='#fff';
  const a='MONSTER L', b='B', gap=size*0.05, lw=size*0.78, cap=size*0.72;
  const wa=ctx.measureText(a).width, wb=ctx.measureText(b).width;
  let x=xRight-(wa+gap+lw+gap+wb);
  ctx.textAlign='left'; ctx.fillText(a,x,yBase); x+=wa+gap;
  const t=size*0.19;
  poly(ctx,[[x,yBase],[x+lw/2-t*0.55,yBase-cap],[x+lw/2+t*0.55,yBase-cap],[x+lw,yBase],[x+lw-t,yBase],[x+lw/2,yBase-cap+t*1.5],[x+t,yBase]],'#fff');
  x+=lw+gap; ctx.fillText(b,x,yBase);
}
function texSide(){
  const w=2048,h=436,m=22,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=GR;x.fillRect(0,0,w,h);
  poly(x,[[m,m],[w*0.345,m],[m,h*0.72]],OR);
  poly(x,[[w*0.325,h-m],[w*0.765,m],[w-m,m],[w-m,h-m]],OR);
  logo(x,m+26,m+18,62,'#fff',OR);
  x.fillStyle='#fff';x.textAlign='left';x.font='500 15px '+FONT;
  x.fillText('PERFORMANCE',m+26,m+112);x.fillText('BEYOND LIMITS',m+26,m+134);
  x.fillRect(m+26,m+154,44,5);
  wordmark(x,w*0.972,h*0.60,92);
  x.font='700 17px '+FONT;x.fillStyle='#fff';
  x.fillText('www.monster-lab.co.kr',w*0.622,h*0.83);
  x.fillText('/',w*0.742,h*0.83);
  x.fillText('monsterlab@hanilelec.kr',w*0.766,h*0.83);
  x.textAlign='right';x.fillText('+82 1588 - 1183',w*0.972,h*0.83);
  corrugate(x,w,h,46,0.10);
  return finishTex(c);
}
function texDoor(){
  const w=512,h=544,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=GR;x.fillRect(0,0,w,h);
  poly(x,[[w*0.22,h*0.95],[w*0.50,h*0.95],[w*0.95,h*0.47],[w*0.95,h*0.27]],OR);
  poly(x,[[w*0.90,h*0.95],[w*0.95,h*0.95],[w*0.95,h*0.90]],OR);
  logo(x,w*0.72,h*0.09,w*0.17,OR,GR);
  x.fillStyle=OR;x.fillRect(w*0.08,h*0.09,46,5);
  x.fillStyle='#fff';x.textAlign='left';x.font='800 17px '+FONT;x.fillText('MONSTER LAB',w*0.08,h*0.145);
  x.font='500 13px '+FONT;x.fillText('PERFORMANCE',w*0.08,h*0.215);x.fillText('BEYOND LIMITS',w*0.08,h*0.255);
  corrugate(x,w,h,64,0.05);
  x.fillStyle='rgba(40,40,40,.75)';x.fillRect(w/2-2,h*0.03,4,h*0.94);
  x.strokeStyle='rgba(60,60,60,.55)';x.lineWidth=5;x.strokeRect(w*0.03,h*0.03,w*0.94,h*0.94);
  return finishTex(c);
}
function texPlain(w,h,period,withLogo){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=GR;x.fillRect(0,0,w,h);
  if(withLogo) logo(x,w*0.74,h*0.08,w*0.16,OR,GR);
  corrugate(x,w,h,period,0.10);
  return finishTex(c);
}
function finishTex(c){
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
let CM=null;
function buildContainerMaterials(){
  const mk=t=>new THREE.MeshStandardMaterial({map:t,roughness:0.7,metalness:0.15});
  const side=mk(texSide()), door=mk(texDoor()), back=mk(texPlain(512,544,56,true)), top=mk(texPlain(1024,256,24,false));
  CM=[door,back,top,top,side,side];
}

/* ---------- 형상 도우미 ---------- */
function add(g,mesh,shadow){ if(shadow!==false){mesh.castShadow=true;mesh.receiveShadow=true;} g.add(mesh);return mesh; }
function bx(g,x0,x1,y0,y1,z0,z1,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  return add(g,m,mat!==M.glass);
}
const UP=new THREE.Vector3(0,1,0);
function beam(g,a,b,t,mat){
  const A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]),d=B.clone().sub(A),len=d.length();
  const m=new THREE.Mesh(new THREE.BoxGeometry(t,len,t),mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP,d.normalize());
  return add(g,m);
}
function col(g,x,z,y0,y1,mat,t){t=t||0.2;return bx(g,x-t/2,x+t/2,y0,y1,z-t/2,z+t/2,mat||M.steel);}
function slab(g,x0,x1,z0,z1){return bx(g,x0,x1,-0.18,0,z0,z1,M.slab);}
function deck(g,r,holes,yTop){
  const s=new THREE.Shape();s.moveTo(r[0],r[2]);s.lineTo(r[1],r[2]);s.lineTo(r[1],r[3]);s.lineTo(r[0],r[3]);s.closePath();
  (holes||[]).forEach(h=>{const p=new THREE.Path();p.moveTo(h[0],h[2]);p.lineTo(h[0],h[3]);p.lineTo(h[1],h[3]);p.lineTo(h[1],h[2]);p.closePath();s.holes.push(p);});
  const geo=new THREE.ExtrudeGeometry(s,{depth:DECK_T,bevelEnabled:false});
  const m=new THREE.Mesh(geo,M.deck);m.rotation.x=Math.PI/2;m.position.y=yTop;return add(g,m);
}
function sloped(g,x0,x1,z0,z1,ya,yb,axis,th,mat){
  const w=x1-x0,d=z1-z0,geo=new THREE.BoxGeometry(w,th,d),p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const v=axis==='x'?p.getX(i)/w+0.5:p.getZ(i)/d+0.5;
    p.setY(i,p.getY(i)+ya+(yb-ya)*v-th/2);
  }
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,mat);m.position.set((x0+x1)/2,0,(z0+z1)/2);
  return add(g,m,mat!==M.glass);
}
function railing(g,pts,y){
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);
    if(len<0.05)continue;
    beam(g,[a[0],y+1.1,a[1]],[b[0],y+1.1,b[1]],0.06,M.steel);
    const n=Math.max(1,Math.round(len/1.6));
    for(let k=0;k<=n;k++){const t=k/n;col(g,a[0]+dx*t,a[1]+dz*t,y,y+1.1,M.steel,0.05);}
    const gl=new THREE.Mesh(new THREE.BoxGeometry(len,0.9,0.02),M.glass);
    gl.position.set((a[0]+b[0])/2,y+0.58,(a[1]+b[1])/2);gl.rotation.y=-Math.atan2(dz,dx);g.add(gl);
  }
}
function glassWall(g,a,b,y0,y1){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);
  const gl=new THREE.Mesh(new THREE.BoxGeometry(len,y1-y0,0.03),M.glass);
  gl.position.set((a[0]+b[0])/2,(y0+y1)/2,(a[1]+b[1])/2);gl.rotation.y=-Math.atan2(dz,dx);g.add(gl);
  const n=Math.max(1,Math.round(len/1.5));
  for(let k=0;k<=n;k++){const t=k/n;col(g,a[0]+dx*t,a[1]+dz*t,y0,y1,M.steel,0.07);}
  beam(g,[a[0],y0+0.04,a[1]],[b[0],y0+0.04,b[1]],0.08,M.steel);
  beam(g,[a[0],y1-0.04,a[1]],[b[0],y1-0.04,b[1]],0.08,M.steel);
}
const ROT={'+x':0,'-x':Math.PI,'+z':-Math.PI/2,'-z':Math.PI/2};
/* 컨테이너: dir = 출입문이 향하는 방향 */
function container(g,cx,y,cz,dir){
  const c=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(L,H,W),CM);body.position.y=H/2;add(c,body);
  const e=0.1,o=0.012;
  [-1,1].forEach(sx=>[-1,1].forEach(sz=>bx(c,sx*(L/2+o)-sx*e,sx*(L/2+o),0,H+o,sz*(W/2+o)-sz*e,sz*(W/2+o),M.frame)));
  [-1,1].forEach(sz=>[0,H-e+o].forEach(yy=>bx(c,-L/2,L/2,yy,yy+e,sz*(W/2+o)-sz*e,sz*(W/2+o),M.frame)));
  [-1,1].forEach(sx=>[0,H-e+o].forEach(yy=>bx(c,sx*(L/2+o)-sx*e,sx*(L/2+o),yy,yy+e,-W/2,W/2,M.frame)));
  [-0.9,-0.32,0.32,0.9].forEach(z=>{
    const r=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,H-0.24,8),M.frame);
    r.position.set(L/2+0.035,H/2,z);add(c,r);
    bx(c,L/2+0.01,L/2+0.06,1.05,1.1,z-0.02,z+(z<0?0.24:-0.24),M.frame);
  });
  c.position.set(cx,y,cz);c.rotation.y=ROT[dir];g.add(c);return c;
}
/* 계단: (x,z)에서 dir 방향으로 올라가 RUN 만큼 진행 후 2층 바닥에 도착 */
function stair(g,o){
  const s=new THREE.Group(),w=o.width,n=ST.n,r=o.rise/n,k=ST.landAt;
  let x=0,l0=0,l1=0;
  for(let i=1;i<n;i++){
    const len=i===k?ST.land:ST.tread;
    bx(s,x,x+len,i*r-0.05,i*r,-w/2,w/2,M.tread);
    bx(s,x,x+0.02,(i-1)*r,i*r-0.05,-w/2,w/2,M.steel);
    if(i===k){l0=x;l1=x+len;}
    x+=len;
  }
  bx(s,x-0.02,x,(n-1)*r,n*r-DECK_T,-w/2,w/2,M.steel);
  const yk=k*r,segs=[[0,r,l0,yk],[l0,yk,l1,yk+r],[l1,yk+r,x,n*r]];
  [-1,1].forEach(sd=>{
    const z=sd*(w/2+0.06);
    segs.forEach((sg,i)=>{
      beam(s,[sg[0],sg[1]-0.2,z],[sg[2],sg[3]-0.2,z],0.12,M.steel);
      beam(s,[sg[0],sg[1]+1.0,z],[sg[2],sg[3]+1.0,z],0.06,M.steel);
      beam(s,[sg[0],sg[1]+0.5,z],[sg[2],sg[3]+0.5,z],0.035,M.steel);
      const parts=i===1?1:3;
      for(let q=0;q<=parts;q++){const t=q/parts,px=sg[0]+(sg[2]-sg[0])*t,py=sg[1]+(sg[3]-sg[1])*t;col(s,px,z,py-0.15,py+1.0,M.steel,0.05);}
    });
    col(s,l0+0.1,z,0,yk-0.1,M.steel,0.12);col(s,l1-0.1,z,0,yk-0.1,M.steel,0.12);
  });
  s.position.set(o.x,o.y0||0,o.z);s.rotation.y=ROT[o.dir];g.add(s);return s;
}

 {t:'배치안 4. ㅁ자 배치와 중정',
  p:'4동을 풍차 모양으로 돌려 놓아 ㅁ자를 만들었습니다. 컨테이너 끝과 옆 컨테이너 사이를 2.5 m씩 띄워 세 사람이 나란히 지날 수 있습니다.',
  li:['한 변 17.1 m로 부지 세로 20 m 안에 들어갑니다. 정사각 ㅁ자(끝과 끝을 띄우는 방식)는 22 m가 넘어 불가합니다.','1층은 전면 왼쪽 틈 하나만 출입구로 열고 나머지 세 틈은 벽으로 막았습니다.','2층 바닥 가운데를 7.85 m 각으로 뚫어 중정을 만들고, 그 안에 폭 2.4 m 계단을 두었습니다.','지붕은 전면 유리, 2층 틈은 유리 벽으로 마감했습니다.'],
  s:[['층 구성','1층 4동 + 2층 4동'],['틈 / 중정','2.5 m / 12.3 m 각'],['계단','폭 2.4 m, 20단']]}
];

/* ---------- 장면 구성 ---------- */
const cases=[],site=new THREE.Group();
let cur=0;
function buildSite(){
  const p=new THREE.Mesh(new THREE.BoxGeometry(50,0.1,20),M.site);p.position.y=-0.24;p.receiveShadow=true;site.add(p);
  const pts=[[-25,-10],[25,-10],[25,10],[-25,10],[-25,-10]].map(a=>new THREE.Vector3(a[0],-0.17,a[1]));
  site.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff})));
  const a=label('50 m');a.position.set(0,0.6,10.9);site.add(a);
  const b=label('20 m');b.position.set(25.9,0.6,0);site.add(b);
  scene.add(site);
}
function init(){
  buildContainerMaterials();
  buildSite();
  [case1,case2,case3,case4].forEach((fn,i)=>{
    const c=fn();
    const box=new THREE.Box3().setFromObject(c.g),ctr=box.getCenter(new THREE.Vector3());
    c.g.position.set(-ctr.x,0,-ctr.z);
    c.size=box.getSize(new THREE.Vector3());
    c.g.visible=false;scene.add(c.g);cases.push(c);
  });
  show(0);resize();loop();
}
function setView(kind){
  const c=cases[cur],d=Math.max(c.size.x,c.size.z*1.4)*1.0+10,ty=c.size.y*0.4;
  controls.target.set(0,ty,0);
  if(kind==='front')camera.position.set(0,ty+d*0.18,d*1.25);
  else if(kind==='back')camera.position.set(d*0.35,ty+d*0.35,-d*1.15);
  else if(kind==='top')camera.position.set(0,d*1.5,0.01);
  else camera.position.set(-d*0.62,ty+d*0.3,d*1.0);
  controls.update();
}
function applyToggles(){
  const c=cases[cur];
  c.rf.visible=document.getElementById('tRoof').checked;
  c.f2.visible=document.getElementById('tF2').checked;
  site.visible=document.getElementById('tSite').checked;
  const pv=document.getElementById('tPeople').checked;
  c.g.traverse(o=>{if(o.userData.person)o.visible=pv;});
}
function show(i){
  cases.forEach((c,k)=>c.g.visible=k===i);cur=i;
  document.querySelectorAll('.cases button').forEach((b,k)=>b.setAttribute('aria-selected',k===i?'true':'false'));
  const d=INFO[i],c=cases[i];
  document.getElementById('info').innerHTML='<h1>'+d.t+'</h1><p>'+d.p+'</p><ul>'+d.li.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
    '<dl class="spec"><dt>점유 크기</dt><dd>가로 '+m1(c.size.x)+' m × 세로 '+m1(c.size.z)+' m (부지 50 × 20 m)</dd>'+
    '<dt>최고 높이</dt><dd>'+m1(c.size.y-0.18)+' m</dd>'+d.s.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')+
    '<dt>컨테이너</dt><dd>40ft, 12.19 × 2.44 × 2.59 m, 무창</dd></dl>';
  applyToggles();setView('iso');
}
function resize(){
  const w=stage.clientWidth||1,h=stage.clientHeight||1;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}

document.querySelectorAll('.cases button').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.case)));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
['tRoof','tF2','tSite','tPeople'].forEach(id=>document.getElementById(id).addEventListener('change',applyToggles));
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.__ready=false;
const start=()=>{try{init();window.__ready=true;}catch(e){console.error(e);document.getElementById('err').style.display='grid';}};
if(document.fonts&&document.fonts.load){
  Promise.race([Promise.all([document.fonts.load('800 60px Montserrat'),document.fonts.load('700 20px Montserrat'),document.fonts.load('500 14px Montserrat')]),new Promise(r=>setTimeout(r,2500))]).then(start,start);
}else start();
window.__show=show;window.__view=setView;
})();
</script>
</body>
</html>
